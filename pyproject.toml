[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hopmatch"
version = "0.1.0"
description = "Note olfactive → molécules → houblons : accorder un houblon à un ajout."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Quentin", email = "quentin4313@gmail.com"}]
dependencies = []

[project.optional-dependencies]
crawl = ["requests>=2.31", "beautifulsoup4>=4.12", "pyyaml>=6.0"]
foodb = ["pandas>=2.0"]
ui = ["streamlit>=1.50", "altair>=5.0", "pillow>=10.0"]
dev = ["pytest>=7"]

[project.scripts]
hopmatch = "hopmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
