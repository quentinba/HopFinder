[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hopmatch"
version = "0.1.0"
description = "Note olfactive → molécules → houblons : accorder ou recomposer des profils avec du houblon."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Quentin"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
crawl = ["requests>=2.31", "beautifulsoup4>=4.12"]
foodb = ["pandas>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
hopmatch = "hopmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
