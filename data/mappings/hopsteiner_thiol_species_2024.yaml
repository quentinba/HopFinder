# T96 (2026-09-08) : Schmidt, C.; Hoferer, L.; Biendl, M. "Determination of
# Variety Dependent 'Thiol Impact' Based on LC-MS/MS Analysis of Different Hop
# Samples Collected Worldwide." BrewingScience 77 (Nov/Dec 2024), pp. 135-141.
# https://doi.org/10.23763/BrSc24-10schmidt -- CC-BY 4.0, open access. Auteurs
# Hopsteiner (Hallertauer Hopfenveredelungsges.m.b.H.). LC-MS/MS sur 250
# échantillons, 97 variétés, 12 pays, 5 millésimes (2019-2023) -- SEULE source
# par variété trouvée pour 3MH/4MMP/3M4MP individuellement (notre `thiols`
# BarthHaas reste un agrégat des trois, voir T95/CLAUDE.md).
#
# Curation manuelle depuis les tableaux du PDF (pas un parseur -- table
# scannée/mise en page en 2 colonnes avec bandeau de marge répété, aucun
# extracteur fiable ; même précédent que hop_breeder_pedigree.yaml, prose
# BeerMaverick trop hétérogène pour un regex). Transcription vérifiée
# visuellement page par page (rendu PDF->image), pas un OCR automatique.
#
# ⚠ CE QUE CES DONNÉES SONT / NE SONT PAS -- lire avant toute utilisation :
# - `impact_classification` : la classification "low"/"medium"/"high" que le
#   papier assigne lui-même par variété (tables 4-6), construite à partir du
#   MAXIMUM observé sur tous les échantillons/millésimes/régions de cette
#   variété -- PAS une concentration, PAS une valeur "typique". Le détail par
#   composé sous-jacent au papier n'est publié QUE sous forme de seuils
#   ("n.d." / "<10 µg/kg" / ">10 µg/kg", ">10" SANS PLAFOND PUBLIÉ pour la
#   quasi-totalité des entrées) -- volontairement PAS repris ici, PAS écrit
#   dans `hop_composition` (aucun vmax défendable pour un intervalle ouvert,
#   voir CLAUDE.md règle n°1 -- jamais de valeur inventée). Seule la
#   catégorie finale (résultat du raisonnement des auteurs, pas une mesure
#   brute) est retenue.
# - `exact_point_values` : les SEULES valeurs numériques ponctuelles que le
#   papier donne en toutes lettres dans son texte (pas lues sur un graphique
#   -- Fig. 2 du papier reste un graphique, jamais utilisée ici, cf. T98).
#   Ce sont les valeurs RECORD ("by far the two highest concentrations...",
#   "just three cultivars show more than...") -- le maximum observé pour
#   cette variété sur CE composé, pas une valeur représentative/moyenne.
#
# `country` : pays de culture de l'échantillon testé (le papier montre que la
# région influence fortement le résultat, ex. Cascade USA="high" mais Cascade
# Allemagne/Argentine="medium" -- une variété dont le papier teste plusieurs
# pays avec des catégories DIFFÉRENTES est exclue de l'application côté
# ingestion plutôt que de deviner laquelle s'applique à notre entrée générique
# ; voir ingest.ingest_hopsteiner_thiols). Codes tels qu'imprimés dans le
# papier (ex. "USA", "England") -- la correspondance vers `hops.region` est
# faite par l'ingestion, jamais ici.

exact_point_values:
  # variety (nom paper), compound (4mmp/3mh/3m4mp), value µg/kg -- valeur
  # RECORD/maximum, jamais une moyenne. Citations exactes du texte (p.139) :
  - {variety: Mosaic, compound: 3m4mp, value_ug_kg: 96}
  - {variety: Nelson Sauvin, compound: 3m4mp, value_ug_kg: 83}
  - {variety: Citra, compound: 4mmp, value_ug_kg: 38}
  - {variety: Eureka!, compound: 4mmp, value_ug_kg: 26}
