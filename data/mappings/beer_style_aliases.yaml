# Editorial style label -> BJCP 2021 style_id, or null.
#
# T84 backlog. Three intended uses, one file (never fused/deduplicated
# differently per use):
#   1. Yakima Chief's `imported_fields.beer_types` (Algolia, T83) -- 47
#      distinct labels observed live on 144/153 varieties (2026-08-27),
#      counts noted below for reference. Editorial vocabulary written by
#      Yakima's own content team, NOT BJCP terminology.
#   2. Free-text style strings from MMuM recipes (T91/T92), in GERMAN
#      (e.g. "India Pale Ale (sonstige)", "Deutsches Pilsner", "Amber
#      Ale") -- not yet added, MMuM ingestion (T91) hasn't run. Add German
#      keys to this SAME file when T91/T92 land, reviewed the same way.
#   3. beer-analytics.com style page names (T85, `<h1>`, English) -- see
#      the dedicated section near the end of this file. Distinct vocabulary
#      from Yakima's (much closer to literal BJCP names, but with EXTRA
#      granularity BJCP doesn't have -- see that section's own header).
#
# Every non-null value here was checked BY HAND against BJCP 2021
# (`beer_styles.style_id`, 110 real styles) -- never fuzzy-matched or
# auto-derived (see CLAUDE.md: FooDB auto-derived descriptors were
# rejected twice for the same failure mode -- converging on a plausible-
# looking but wrong generic answer). Reviewed with the user 2026-08-27.
#
# A label is left `null` whenever more than one BJCP style is a
# defensible match (e.g. "Wheat" -> American Wheat Beer 1D or Weissbier
# 10A, both equally arguable) -- guessing one would misrepresent a hop's
# real style range as more precise than the source label actually is.
# "All Styles"/"Ale"/"Amber"/"Imperial Ale" are called out explicitly by
# the T83 ticket text itself as having no BJCP equivalent.
#
# Counts = number of Yakima varieties carrying that exact label (live
# Algolia fetch, 2026-08-27) -- for traceability only, not used at runtime.

